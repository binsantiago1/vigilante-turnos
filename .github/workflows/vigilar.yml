name: Vigilar turnos

on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 minutos (GitHub a veces se retrasa un poco)
  workflow_dispatch:         # permite lanzarlo a mano desde la pestaña Actions
    inputs:
      prueba:
        description: "Enviar una notificación de prueba"
        type: boolean
        default: true

concurrency:
  group: vigilar-turnos
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Revisar la página
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MODO_PRUEBA: ${{ github.event_name == 'workflow_dispatch' && inputs.prueba }}
        run: python vigilar.py
